# Netlify settings for oxfordbiodata.com
# Plain HTML site: there is no build step, Netlify publishes the repo root as-is.

[build]
  publish = "."

# Fonts never change, so browsers can keep them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
